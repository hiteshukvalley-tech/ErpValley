<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07132F" />
    <title>ERPVALLEY — ERP Software & IT Solutions</title>
    <meta
      name="description"
      content="ERPVALLEY connects finance, sales, inventory, HR and operations in one ERP platform, with implementation and custom development services."
    />
    <link rel="canonical" href="https://erpvalley.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ERPVALLEY" />
    <meta property="og:url" content="https://erpvalley.in/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      ;(function () {
        try {
          var saved = localStorage.getItem('ev-theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
